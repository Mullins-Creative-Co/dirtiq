name: Refresh experimental NFL pregame projections
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/matchups-refresh.yml'
      - 'scripts/matchups/**'
      - 'scripts/football/pregame_features.py'
      - 'src/lib/football/model.ts'
permissions:
  contents: write
concurrency:
  group: matchups-pregame-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/football/requirements.txt
      - uses: actions/cache@v4
        with:
          path: /tmp/dirtiq-pregame-cache
          key: nfl-pregame-sources-v1-${{ github.run_id }}
          restore-keys: nfl-pregame-sources-v1-
      - run: npm ci
      - run: pip install -r scripts/football/requirements.txt
      - run: npm run test:matchups
      - run: python -m unittest discover -s tests -p 'test_pregame_features.py'
      - run: npm run matchups:refresh
      - name: Publish only matchup projections, preserving other writers
        run: |
          git config user.name 'DirtIQ data bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/matchups/pregame.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh timestamped experimental NFL pregame projections'
          git pull --rebase origin main
          git push origin HEAD:main
