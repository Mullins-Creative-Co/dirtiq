name: Refresh race data and lock forecasts

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '*/15 * 10-13 9 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world100-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt
      - name: Refresh verified results and predictions
        run: |
          export REFRESH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python scripts/auto_refresh.py
          # auto_refresh records errors in JSON but exits zero; make Actions reflect failures.
          python - <<'PY'
          import json, sys, os
          from datetime import datetime
          sys.path.insert(0, 'scripts')
          from model_runtime import DATA_DIR
          status = json.loads((DATA_DIR / 'automation-status.json').read_text())
          last = datetime.fromisoformat(status['lastRun'].replace('Z', '+00:00'))
          started = datetime.fromisoformat(os.environ['REFRESH_STARTED_AT'].replace('Z', '+00:00'))
          if not status.get('ok') or last < started:
              raise SystemExit('Race refresh failed; see automation-status.json')
          PY
      - name: Publish refreshed database and prediction caches
        run: |
          python - <<'PY'
          import shutil, sqlite3
          from pathlib import Path
          source=sqlite3.connect('data/dirtiq.db')
          target=sqlite3.connect('public/data/dirtiq.seed.next.db')
          source.backup(target); source.close(); target.close()
          Path('public/data/dirtiq.seed.next.db').replace('public/data/dirtiq.seed.db')
          import json
          from datetime import datetime, timezone
          Path('public/data/race-refresh.json').write_text(json.dumps({'refreshedAt': datetime.now(timezone.utc).isoformat()}) + '\n')
          public=Path('public/data/ml-predictions'); public.mkdir(parents=True,exist_ok=True)
          for cache in Path('data/ml-predictions').glob('*.json'):
              shutil.copy2(cache,public/cache.name)
          PY
      - name: Commit published data changes
        run: |
          git config user.name "DirtIQ data bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data/feature_params_*.json data/dirtiq_model_*.pkl reports
          git diff --cached --quiet || git commit -m "Refresh verified race data"
          # Other bots publish to main too; replay this run's files on top of whatever landed meanwhile.
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
