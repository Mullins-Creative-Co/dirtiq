name: Refresh team-sport forecasts and ledger
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sports-refresh.yml'
      - 'dirtiq_model/teams/**'
      - 'dirtiq_model/ledger_core.py'
      - 'dirtiq_model/scoring.py'
permissions:
  contents: write
concurrency:
  group: sports-forecast-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      # The cache also holds the ESPN per-game odds history (sports-cache/<sport>/espn), so only
      # new and still-open games are fetched on each run.
      - uses: actions/cache@v4
        with:
          path: sports-cache
          key: sports-sources-v2-${{ github.run_id }}
          restore-keys: |
            sports-sources-v2-
            sports-sources-v1-
      - run: pip install -r requirements.txt
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest discover -s tests -p 'test_teams*.py'
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest discover -s tests -p 'test_ledger.py'
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest discover -s tests -p 'test_odds.py'
      - name: Settle, forecast, snapshot odds and export
        env:
          DIRTIQ_SPORTS_CACHE: ${{ github.workspace }}/sports-cache
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -e
          for sport in nfl nba nhl ncaab mlb ncaaf; do
            python -m dirtiq_model teams settle --sport "$sport" --refresh || echo "settle $sport failed"
            python -m dirtiq_model teams forecast --sport "$sport" || echo "forecast $sport failed"
          done
          # Closing-line snapshots for the focus sports. The free tier allows 500 requests a month and
          # each sport call costs two, so snapshots run at two of the four daily runs (18:41 and 00:41 UTC,
          # before the evening tips) and a sport with no game in the next 30 hours is skipped by the command.
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "18" ] || [ "$HOUR" = "00" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            for sport in nfl ncaaf nba ncaab; do
              python -m dirtiq_model odds snapshot --sport "$sport" || echo "odds $sport failed"
            done
          else
            echo "odds snapshots run at 18:41 and 00:41 UTC; skipped this run"
          fi
          python -m dirtiq_model ledger export
      - name: Publish only sport reports and the ledger, preserving other writers
        run: |
          git config user.name 'DirtIQ data bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/sports public/data/forecast-ledger.json public/data/model-health.json public/data/odds public/data/results
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh team-sport forecasts and ledger'
          # Generated files always conflict when two refreshes overlap; the newer run's files win.
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
