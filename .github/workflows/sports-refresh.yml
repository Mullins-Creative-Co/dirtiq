name: Refresh team-sport forecasts and ledger
on:
  schedule:
    # Hourly from about 5 AM to 1 AM Eastern (10:41-05:41 UTC), plus one overnight run to settle
    # late games. GitHub cron is UTC only, so the window shifts an hour with daylight time.
    - cron: '41 0-5,8,10-23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sports-refresh.yml'
      - 'dirtiq_model/teams/**'
      - 'dirtiq_model/card/**'
      - 'dirtiq_model/ledger_core.py'
      - 'dirtiq_model/scoring.py'
permissions:
  contents: write
concurrency:
  group: sports-forecast-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      # The cache also holds the ESPN per-game odds history (sports-cache/<sport>/espn), so only
      # new and still-open games are fetched on each run.
      - uses: actions/cache@v4
        with:
          path: sports-cache
          key: sports-sources-v2-${{ github.run_id }}
          restore-keys: |
            sports-sources-v2-
            sports-sources-v1-
      - run: pip install -r requirements.txt
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest discover -s tests -p 'test_teams*.py'
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest discover -s tests -p 'test_ledger.py'
      - run: OPENBLAS_NUM_THREADS=1 python -m unittest discover -s tests -p 'test_odds.py'
      - run: python -m unittest discover -s tests -p 'test_card.py'
      - name: Settle, forecast, snapshot odds and export
        env:
          DIRTIQ_SPORTS_CACHE: ${{ github.workspace }}/sports-cache
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -e
          for sport in nfl nba nhl ncaab mlb ncaaf; do
            python -m dirtiq_model teams settle --sport "$sport" --refresh || echo "settle $sport failed"
            python -m dirtiq_model teams forecast --sport "$sport" || echo "forecast $sport failed"
          done
          # Closing-line snapshots for the focus sports. The free tier allows 500 requests a month and
          # each sport call costs two, so snapshots run twice a day: in the first run after 18:00 UTC
          # and the first after 00:00 UTC (before and during the evening tips). The published
          # status file records the last attempt, so hourly or delayed runs never repeat a slot,
          # and a sport with no game in the next 30 hours is skipped by the command.
          DUE=$(python - <<'PY'
          import datetime as dt, json
          now = dt.datetime.now(dt.timezone.utc)
          slot = now.replace(hour=18 if now.hour >= 18 else 0, minute=0, second=0, microsecond=0)
          try:
              last = dt.datetime.fromisoformat(json.load(open("public/data/odds/status.json"))["checkedAt"].replace("Z", "+00:00"))
          except Exception:
              last = None
          print("yes" if last is None or last < slot else "no")
          PY
          )
          if [ "$DUE" = "yes" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            for sport in nfl ncaaf nba ncaab; do
              python -m dirtiq_model odds snapshot --sport "$sport" || echo "odds $sport failed"
            done
          else
            echo "odds snapshots already taken for this slot (slots open at 18:00 and 00:00 UTC); skipped this run"
          fi
          python -m dirtiq_model ledger export
          # Today's card: grade earlier cards, lock today's picks at their first listed line.
          python -m dirtiq_model card build || echo "card build failed"
      - name: Publish only sport reports and the ledger, preserving other writers
        run: |
          git config user.name 'DirtIQ data bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/sports public/data/forecast-ledger.json public/data/model-health.json public/data/odds public/data/results public/data/daily-card.json public/data/cards
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh team-sport forecasts and ledger'
          # Generated files always conflict when two refreshes overlap; the newer run's files win.
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
